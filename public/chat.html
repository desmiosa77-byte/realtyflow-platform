<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat with us</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f1f3f6; color: #0f1b2d;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box;
  }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  p { margin: 0; color: #4a5a70; max-width: 32ch; line-height: 1.5; }
</style>
</head>
<body>
<div>
  <h1 id="name">Welcome</h1>
  <p>Tap the chat bubble to ask about our properties. We reply instantly.</p>
</div>
<script>
  var id = location.pathname.split('/').filter(Boolean).pop();
  fetch('/api/public/' + encodeURIComponent(id))
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (t) {
      document.getElementById('name').textContent = t.business_name;
      document.title = t.business_name;
      var s = document.createElement('script');
      s.src = '/widget.js';
      s.setAttribute('data-tenant', id);
      document.body.appendChild(s);
    })
    .catch(function () {
      document.getElementById('name').textContent = 'This chat link is not valid';
    });
</script>
</body>
</html>
